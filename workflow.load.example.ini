[inputs]
# Directory containing the four derived-allele VCFs.
vcf_dir = /path/to/load_3vcf_derived_sift
population_dir = /path/to/population_lists
# Current population BIO predictors and coordinates.
predictors = /path/to/pop_geo_niche_predictors.csv
# Four future mean-climate CSVs.
future_dir = /path/to/future_load
mask = /path/to/species_mask.shp

[analysis]
output_dir = /path/to/results/bioma_load

[parameters]
# The production values can be increased after the small test passes.
n_splits = 1000
cv_v = 5
cv_repeats = 10
grid_size = 50
workers = 16
scheme = svd
seed = 1234
rscript = Rscript
calc_python = python3
# The three scripts are bundled. Set these only to use reviewed replacements.
# calc_script = /path/to/calc_loadM_loadD_from_3vcf.py
# rf_script = /path/to/rf_one_target_svd.R
# predict_script = /path/to/predict_future_one_target.R
future_pattern = future_env_ssp*_mean.csv
# Set zero to accept any non-empty scenario set.
expected_future_files = 0
