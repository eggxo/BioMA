[inputs]
vcf = /path/to/whole_genome.mis0.9.maf0.00001.vcf
lonlat = /path/to/population_lonlat.tsv
# Optional habitat-retention table for scenario points on the curves.
scenario_file =

[analysis]
output_dir = /path/to/results/bioma_mar
name = my_species_mar
geom_id = 7

[parameters]
# maxsnps=auto counts non-header VCF records; set an integer only to cap it.
maxsnps = auto
# Supported by the locked mar 0.2.0 package: random, inwards, outwards,
# northsouth, and southnorth.
scheme = random
nrep = 10
xfrac = 0.01
quorum = true
randseed = 123
marsteps = data,gm,sfs,mar,ext,plot
rscript = Rscript
