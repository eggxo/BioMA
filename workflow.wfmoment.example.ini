[inputs]
# Current binary suitability mask in an equal-area CRS.
current_raster = /path/to/current_suitability_binary.tif
# Table with species and pi_obs.
pi_file = /path/to/pi_observed.csv
# Optional table with species and fst_global_est; required for migration=auto.
structure_file = /path/to/population_structure.csv
# Optional table with species and z_gdar. Use z_gdar in [parameters] instead if absent.
param_file = /path/to/species_parameters.tsv
# Either an area table (Scenario, Area_km2, including current) ...
area_file = /path/to/area_summary.csv
# ... or a JSON mapping of scenario names to future binary masks.
# future_masks_json = /path/to/future_masks.json

[analysis]
species = my_species
output_dir = /path/to/results/wfmoment_2d_deme
plot_title =

[parameters]
# The compute environment must contain numpy, pandas, rasterio and wfmoments.
compute_python = python3
rscript = Rscript
nx = 20
ny = 20
threshold = 0.25
min_valid = 0
# edge is the climate-range contraction main analysis; random is a fragmentation sensitivity run.
loss_mode = edge
direction = east_to_west
# Set migration=auto to calibrate against fst_global_est; 25 reproduces the tested model.
migration = 25
migration_grid = 0.1,0.3,1,3,10,25,50
fst_metric = hudson
theta = auto
# Optional explicit GDAR exponent; leave empty when param_file supplies z_gdar.
# z_gdar = 0.02493104
theta_probe = 1e-4
time3 = 3
time5 = 5
mu = 3.75e-8
midterm_generations = auto
replicates = 1
seed = 12345
include_equilibrium = false
plot_equilibrium = false
plot_raw = false
