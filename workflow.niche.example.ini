[inputs]
work_dir = /path/to/niche_work
occurrence_csv = /path/to/occurrence.csv
current_env_dir = /path/to/climate/current
future_root = /path/to/climate/future
mask_shp = /path/to/species_mask.shp
maxent_jar = /path/to/maxent.jar

[variables]
# Correlation is a pre-filter; MaxEnt CV selects the final variable set.
correlation_threshold = 0.8
correlation_method = pearson
correlation_scope = occurrence
candidate_subset_sizes = 4,6,8

[tuning]
max_models = 500
background_n = 10000
cv_folds = 5
feature_classes = L,LQ,LQH,LQHP
beta_multipliers = 0.5,1,2,3,4
selection_metric = auc
seed = 123

[projection]
periods = 2061-2080,2081-2100
scenarios = ssp245,ssp585
gcms = BCC-CSM2-MR,MPI-ESM1-2-HR,UKESM1-0-LL
ensemble_method = mean
binary_output = false

[analysis]
output_dir = /path/to/results/bioma_niche
rscript = Rscript
plot_rscript = Rscript
