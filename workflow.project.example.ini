[project]
name = my_bioma_project
output_dir = /path/to/results/my_bioma_project
# Completed modules with matching effective configurations are reused.
resume = true
# Stop immediately when one module fails. Set false only for independent modules.
stop_on_error = true
report = true

[modules]
# Give a configuration path to enable a module; use false to disable it.
gf = workflow.example.ini
rona = workflow.rona.example.ini
mar = workflow.mar.example.ini
load = workflow.load.example.ini
niche = workflow.niche.example.ini
wfmoment = workflow.wfmoment.example.ini
vulnerability = workflow.vulnerability.project.example.ini

[inputs]
# Canonical data inputs. The project runner adapts these paths into the
# standalone module configurations while preserving their scientific roles.
adaptive_vcf = /path/to/adaptive_sites.vcf.gz
whole_genome_vcf = /path/to/whole_genome.mis0.9.maf0.00001.vcf.gz
load_vcf_dir = /path/to/load_3vcf_derived_sift
population_samples = /path/to/population_samples.tsv
population_environment = /path/to/population_environment.tsv
rona_unld_dir = /path/to/RONA/unLD
climate_current = /path/to/climate/current_bio
climate_future = /path/to/climate/future_scenarios
species_mask = /path/to/species_mask.shp
population_dir =
load_predictors =
load_future_dir = /path/to/load_future_csv
mar_lonlat =
occurrence_csv =
maxent_jar = /path/to/maxent.jar
wfmoment_current_raster = /path/to/current_suitability_binary.tif
pi_file = /path/to/pi_observed.csv
structure_file = /path/to/population_structure.csv
species_parameters = /path/to/species_parameters.tsv
area_file = /path/to/area_summary.csv
future_masks_json =

[shared]
# Non-empty values override the corresponding values in module configurations.
species = my_species
models = BCC-CSM2-MR,MPI-ESM1-2-HR,UKESM1-0-LL
ssps = 245,585
periods = 2061-2080,2081-2100
seed = 12345
# Leave blank when modules require different R/Python environments.
rscript =
compute_python =

[integration]
# Used when vulnerability input paths are set to auto.
period = 2061-2080
ssp = 245
ensemble_method = mean
# Optional vulnerability overrides. Leave blank to keep the selected module
# profile. `rona_variables = auto` discovers every *_RONA field; summary is
# mean, max, or weighted (with field:weight pairs). Group rules are generic:
# blank means first-seen order and no exclusions.
rona_variables =
rona_summary =
rona_weights =
group_order =
exclude_groups =

[doctor]
# Optional runtime overrides used by `bin/bioma doctor project.ini`.
# Leave blank to discover commands from PATH and module configurations.
python =
rscript =
gdalinfo =
gdallocationinfo =
ogrinfo =
java =
maxent_jar =
