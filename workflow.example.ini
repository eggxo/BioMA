[inputs]
# Adaptive-locus VCF and the sample-to-population table.
vcf = /path/to/adaptive_sites.vcf.gz
samples = /path/to/samples.tsv
# Instead of samples, existing one-file-per-population keep lists can be used:
# sample_groups_dir = /path/to/subcultivar

# Population coordinates, present BIO1-BIO19, future scenario folders, and masks.
coordinates = /path/to/GF_ENV_19bio.txt
present_climate = /path/to/wc2.1_2.5m_bio_present
future_climate = /path/to/future_climate_root
current_mask = /path/to/current_distribution.shp
# Leave blank to use current_mask as the forward-search mask.
future_mask =

[analysis]
output_dir = /path/to/results/my_gf_analysis
models = BCC-CSM2-MR, MPI-ESM1-2-HR, UKESM1-0-LL
ssps = 245, 585
periods = 2061-2080, 2081-2100
# Leave blank to infer the number of adaptive loci from the VCF/frequency table.
# Set an integer only when an independent site-count QC is part of the study.
expected_sites =

[parameters]
# Defaults below can normally be left unchanged.
forward_radii = 100, 250, 500, 1000, inf
minimum_models = 3
ntree = 500
nbin = 1001
corr_threshold = 0.5
seed = 1
