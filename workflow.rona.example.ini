[inputs]
# RONA population allele frequencies (the RONA.revise.R alt.frq format).
alt_frequency = /path/to/adaptive_population_alt_frequency.tsv
# One LD-pruning list per BIO: LD_BIO1.prune.in ... LD_BIO19.prune.in
unld_dir = /path/to/rona_ld
# ID, pop, lon, lat, bio1 ... bio19
environment = /path/to/population_environment.tsv
# The root containing YYYY-YYYY-sspNNN-MODEL directories. Nested roots are OK.
future_climate = /path/to/climate/future
# Optional species/search mask shapefile used for maps.
mask = /path/to/species_mask.shp

[analysis]
output_dir = /path/to/results/rona
models = BCC-CSM2-MR, MPI-ESM1-2-HR, UKESM1-0-LL
ssps = 245, 585
periods = 2061-2080, 2081-2100
# Leave blank unless an independent population-count QC is required.
expected_populations =

[parameters]
# Rscript with terra, plotrix and raster. The server default is auto-detected.
rscript = Rscript
interpolate = true
grid_step = 0.1
grid_k = 15
